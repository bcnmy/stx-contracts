name: Foundry Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Add swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: stable

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.17.1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Forge tests
      run: pnpm test
      env:
        FOUNDRY_PROFILE: ci
        RPC_84532: https://sepolia.base.org
        RPC_11155111_TEST: https://0xrpc.io/sep
        RPC_11155111: https://0xrpc.io/sep
        RPC_1: https://ethereum-rpc.publicnode.com
        RPC_10: https://mainnet.optimism.io
        TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
